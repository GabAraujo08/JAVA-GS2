spring.application.name=checkin-service

# Porta aleatoria (permite varias instancias)
server.port=0
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Banco proprio e independente deste microsservico
spring.datasource.url=jdbc:mysql://localhost:3306/presente_checkin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Estrutura do banco gerenciada somente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# OpenFeign + Circuit Breaker (Resilience4j) + Fallback
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
resilience4j.timelimiter.configs.default.timeout-duration=5s
