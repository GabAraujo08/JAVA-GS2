spring.application.name=idoso-service

# Porta aleatoria (permite varias instancias)
server.port=0
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Banco proprio e independente deste microsservico
spring.datasource.url=jdbc:mysql://localhost:3306/presente_idoso?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Estrutura do banco gerenciada somente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
